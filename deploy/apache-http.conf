<VirtualHost *:80>
    ServerName resume.jimmyzhang.xyz
    DocumentRoot /var/www/luli-acme
    <Directory /var/www/luli-acme>
        AllowOverride None
        Options -Indexes -ExecCGI
        Require all granted
    </Directory>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:4180/ connectiontimeout=5 timeout=135
    ProxyPassReverse / http://127.0.0.1:4180/
    ErrorLog /var/log/luli/apache-error.log
    CustomLog /var/log/luli/apache-access.log combined
</VirtualHost>
