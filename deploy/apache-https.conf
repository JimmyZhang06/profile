<VirtualHost *:80>
    ServerName resume.jimmyzhang.xyz
    DocumentRoot /var/www/luli-acme
    <Directory /var/www/luli-acme>
        AllowOverride None
        Options -Indexes -ExecCGI
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://resume.jimmyzhang.xyz%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName resume.jimmyzhang.xyz
    SSLEngine On
    SSLCertificateFile /etc/luli/acme/live/resume.jimmyzhang.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/luli/acme/live/resume.jimmyzhang.xyz/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 9000000
    ProxyPass / http://127.0.0.1:4180/ connectiontimeout=5 timeout=135
    ProxyPassReverse / http://127.0.0.1:4180/
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog /var/log/luli/apache-error.log
    CustomLog /var/log/luli/apache-access.log combined
</VirtualHost>
