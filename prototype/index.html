<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v1.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="履历" />
    <meta name="apple-mobile-web-app-title" content="履历" />
    <meta name="theme-color" content="#ffffff" />
    <style>:root{color-scheme:light;background:#ffffff}@media screen{:root[data-theme="dark"]{color-scheme:dark;background:#151515}body{background:inherit}}</style>
    <script>
      // Set appearance before first paint; keep the key in sync with useTheme.
      (() => {
        let preference = 'system';
        try { const saved = localStorage.getItem('luli.appearance.v1'); if (['light', 'dark', 'system'].includes(saved)) preference = saved; } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#151515' : '#ffffff';
      })();
    </script>
    <title>履历 · 简历工作空间</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
